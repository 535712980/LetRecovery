name: Build OldWu PE

on: [workflow_dispatch] 

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: List root folders (Debug)
        run: |
          echo "--- 根目录文件夹清单 ---"
          Get-ChildItem -Directory | Select-Object Name
          
      - name: Setup Rust & Build
        shell: pwsh
        run: |
          # 🔍 自动找出根目录下带有 Cargo.toml 的那个文件夹
          $projFolder = (Get-ChildItem -Directory | Where-Object { Test-Path "$($_.Name)\Cargo.toml" }).Name
          Write-Host "===> 找到编译目标目录: $projFolder <==="
          
          # ⚙️ 进入目录并编译
          Set-Location $projFolder
          rustup default stable
          cargo build --release
          
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OldWuPE_Installer
          # 📦 模糊匹配路径，只要编译成功就会打包上传
          path: '**/target/release/LetRecoveryPE.exe'
