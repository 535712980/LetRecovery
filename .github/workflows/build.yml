name: Build LaoWu Installer
on: [workflow_dispatch]

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build Release
        shell: pwsh
        run: |
          Write-Host "正在进入 PE 端 目录编译..."
          Set-Location "PE 端"
          cargo build --release
          
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Old-Five-Installer
          path: 'PE 端/target/release/LetRecoveryPE.exe'
