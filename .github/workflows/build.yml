name: Build OldWu PE (no dll)

on: [workflow_dispatch]

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout 进系统完成
        uses: actions/checkout@v4
        
      - name: Setup Rust BIuId (锁定核心选项)
        shell: pwsh
        run: |
          # 安装 rust 稳定版
          rustup install stable
          rustup default stable

          # 找到附近存储 Progress
          cd "PE 端"
          
          # 静态建立：rustup 安装测试
          cargo build --release

          # 即时完事，Come on testing 文件放大
          & 'C:\Windows\System32\cmd.exe' /C 'copy /Y "target\release\LetRecoveryPE.exe" ..\aquarender\LetRecoveryPE.exe'

      - name: Upload 最终出品
        uses: actions/upload-artifact@v4
        with:
          name: LaoWuPE_Normal
          path: "aquarender/LetRecoveryPE.exe"
