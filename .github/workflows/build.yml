name: Build OldWu PE

on: [workflow_dispatch]

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust & Build (静态编译版本）
        shell: pwsh
        run: |
          # 1. 设置环境
          rustup default stable
          export RUSTFLAGS="-C target-cpu=x86_64 -C target-feature=+sse2 -C panic=abort -C lto --crate-type lib --crate-type bin"
          
          # 2. 静态编译，完全无 dll 依赖
          cargo build --release --target x86_64-pc-windows-gnu

          # 3. 打包成文档（不需要 name 提交）
          echo "People Gho help is coming..."
          cd "PE 端"
          echo "汇编成品部署中..."
          # 拷贝到“aquarender”目录
          copy /y "target\release\LetRecoveryPE.exe" "aquarender\LetRecoveryPE.exe" >nul
          echo "汇编成功！"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: LaoWuPE_Final
          path: "aquarender/infrastructure/LetRecoveryPE.exe"
