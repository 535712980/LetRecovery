name: Build OldWu PE

on: [workflow_dispatch] 

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: List root folders (Debug)
        run: |
          echo "--- 根目录文件夹清单 ---"
          Get-ChildItem -Directory | Select-Object Name
          
      - name: Setup Rust & Build
        shell: pwsh
        run: |
          # 1. 找出所有带 Cargo.toml 的项目文件夹
          $projects = Get-ChildItem -Directory | Where-Object { Test-Path "$($_.Name)\Cargo.toml" }
          Write-Host "===> 发现候选文件夹: $($projects.Name) <==="
          
          # 2. 【关键修改】筛选逻辑：必须是 PE 相关，排除掉 "正常系统端"
          $targetProject = $projects | Where-Object { 
              $_.Name -match "PE" -and $_.Name -notmatch "正常" 
          }

          if ($targetProject.Count -ne 1) {
             throw "未找到唯一的 PE 项目文件夹（找到了 $($targetProject.Count) 个）！请确认文件夹名字是否包含 'PE'"
          }
          
          Write-Host "===> 锁定目标并进入: $($targetProject.Name) <==="
          # ✅ 更安全的 “目录切换” 合法写法
          cd $targetProject.FullName

          # 3. 开始编译
          cargo build --release
          
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: LaoWu-PE-Installer
          # 自动在深层目录下寻找生成的文件
          path: '**/target/release/LetRecoveryPE.exe'
