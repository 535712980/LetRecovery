name: Build LaoWu Installer

on: [workflow_dispatch]

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build Release
        run: |
          # 👇 这里是关键：显式告诉电脑文件夹名叫 "PE 端"（带空格）
          cd "PE 端"
          cargo build --release
          
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: LaoWu-Installer
          # 👇 上传的路径也要改成准确的文件夹名
          path: "./PE 端/target/release/LetRecoveryPE.exe"
