[package]
name = "letrecovery-pe"
version = "2026.1.0"
edition = "2021"
authors = ["NORMAL-EX"]
description = "老五系统一键安装助手"

# ==========================================
# 核心依赖
# ==========================================
[dependencies]

# GUI 框架
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"

# 序列化
serde = { version = "1", features = ["derive"] }

# 错误处理与日志
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

# Windows API 调用
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Shutdown",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

# DLL 动态加载（针对 wimgapi.dll / setupapi.dll）
libloading = "0.8"

# 编码转换
encoding_rs = "0.8"

# 其他工具
walkdir = "2"
image = "0.25"

# ✅ 【新增】用于图形界面的文件夹选择对话框（老五安装器专用）
rfd = "0.10"


# ==========================================
# 构建配置
# ==========================================
[build-dependencies]
winres = "0.1"

[[bin]]
name = "LetRecoveryPE"
path = "src/main.rs"

[profile.release]
# 极致压缩体积以适配 PE 环境
opt-level = "z"     # optimize for size
lto = true          # link-time optimization
codegen-units = 1   # reduce number of codegen units to increase optimization
strip = true        # strip symbols from binary files
